[package]
name = "breakpoints"
version = "0.1.0"
description = "Reads your codebase and builds the responsive test environment your site actually uses."
edition = "2021"
rust-version = "1.77"

[lib]
name = "breakpoints_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` so the Inspect button still works in a bundled build. It is on
# automatically in a debug build and off in release without this.
tauri = { version = "2", features = ["unstable", "macos-private-api", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# scanning
ignore = "0.4"
regex = "1"
yaml-rust2 = "0.10"
sha2 = "0.10"
rand = "0.8"

# watching
notify = "6"
notify-debouncer-full = "0.3"

# bridge
axum = { version = "0.7", features = ["macros", "ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# screenshots
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.dev]
incremental = true
